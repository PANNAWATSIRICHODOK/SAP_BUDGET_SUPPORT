<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Entry page for SAP Budget Support presentation"

    <title>SAP Budget Support</title>
    <meta http-equiv="refresh" content="0; url=./pages/addons-budget-flow.html" />
    <style>

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Sarabun", "Noto Sans Thai", "TH Sarabun New", "Leelawadee UI", "Segoe UI", sans-serif;
        color: #111827;
        background: #f6f7f9;
      }

      main {
        width: min(calc(100% - 2rem), 760px);
        padding: 1.35rem;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 10px 24px rgba(16, 24, 40, 0.08);
      }

      h1 {
        margin: 0 0 0.8rem;

        min-height: 2.4rem;
        padding: 0 1rem;
        border-radius: 6px;

    <script>
